<div class="min-h-screen flex items-center justify-center bg-[var(--bg-main)] p-4">
  <div class="glass-panel w-full max-w-md p-8 rounded-2xl relative overflow-hidden">
    <!-- Decorative background blobs -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-[var(--primary-light)] rounded-full blur-3xl opacity-50"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-[var(--info-light)] rounded-full blur-3xl opacity-50"></div>
    
    <div class="relative z-10">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-2">Bienvenue</h1>
        <p class="text-[var(--text-secondary)]">Connectez-vous pour accéder au tableau de bord</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1">Email</label>
          <input type="email" [(ngModel)]="email" name="email" class="w-full px-4 py-3 rounded-xl border border-[var(--border-color)] bg-white focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent transition-all" placeholder="nom@transport.com" required>
        </div>
        
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-medium text-[var(--text-secondary)]">Mot de passe</label>
            <a href="#" class="text-xs text-[var(--primary)] hover:underline">Mot de passe oublié ?</a>
          </div>
          <input type="password" [(ngModel)]="password" name="password" class="w-full px-4 py-3 rounded-xl border border-[var(--border-color)] bg-white focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent transition-all" placeholder="••••••••" required>
        </div>

        <div *ngIf="error" class="bg-[var(--danger-light)] text-[var(--danger)] px-4 py-3 rounded-xl text-sm border border-[#ffe4e6]">
          {{ error }}
        </div>

        <button type="submit" [disabled]="isLoading" class="w-full btn-primary justify-center py-3 text-lg mt-2">
          <span *ngIf="isLoading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>
          {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-[var(--border-color)]">
        <p class="text-sm text-center text-[var(--text-secondary)] mb-4">Comptes de démonstration</p>
        <div class="grid grid-cols-3 gap-2">
          <button (click)="fillDemo('admin')" class="py-2 px-3 text-xs font-semibold rounded-lg bg-[var(--primary-light)] text-[var(--primary-hover)] hover:bg-[#c7d2fe] transition-colors">
            Admin
          </button>
          <button (click)="fillDemo('agent')" class="py-2 px-3 text-xs font-semibold rounded-lg bg-[var(--success-light)] text-[#15803d] hover:bg-[#bbf7d0] transition-colors">
            Agent
          </button>
          <button (click)="fillDemo('driver')" class="py-2 px-3 text-xs font-semibold rounded-lg bg-[var(--warning-light)] text-[#b45309] hover:bg-[#fde68a] transition-colors">
            Chauffeur
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

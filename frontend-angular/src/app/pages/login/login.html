<div class="min-h-screen flex items-center justify-center bg-[var(--bg-main)] p-4">
  <div class="glass-panel w-full max-w-md p-8 rounded-2xl relative overflow-hidden bg-white shadow-xl border border-[#e2e8f0]">
    <!-- Decorative background blobs -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-[var(--primary-light)] rounded-full blur-3xl opacity-50"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-[var(--info-light)] rounded-full blur-3xl opacity-50"></div>
    
    <div class="relative z-10">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-[#edf3e6] text-[#788e4b] mb-3">
          <span class="material-icons text-2xl">directions_bus</span>
        </div>
        <h1 class="text-2xl font-extrabold text-[#0f172a] mb-1">TransExpress</h1>
        <p class="text-sm text-[#64748b]">Sélectionnez un profil ou connectez-vous</p>
      </div>

      <!-- Quick Role Switcher Tabs -->
      <div class="grid grid-cols-4 gap-1 p-1 bg-[#f1f5f9] rounded-xl mb-5">
        <button 
          *ngFor="let r of roles"
          type="button"
          (click)="selectRole(r.id)"
          [class.bg-white]="selectedRole === r.id"
          [class.shadow-sm]="selectedRole === r.id"
          [class.text-[#788e4b]]="selectedRole === r.id"
          class="py-2 px-1 text-xs font-bold rounded-lg transition-all text-[#64748b] text-center"
        >
          {{ r.label }}
        </button>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-[#475569] uppercase mb-1">Email</label>
          <input type="email" [(ngModel)]="email" name="email" class="w-full px-4 py-2.5 rounded-xl border border-[#cbd5e1] bg-[#f8fafc] focus:outline-none focus:border-[#788e4b] focus:bg-white text-sm" placeholder="nom@transport.com" required>
        </div>
        
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold text-[#475569] uppercase">Mot de passe</label>
            <span class="text-xs text-[#788e4b] cursor-pointer">Mot de passe oublié ?</span>
          </div>
          <input type="password" [(ngModel)]="password" name="password" class="w-full px-4 py-2.5 rounded-xl border border-[#cbd5e1] bg-[#f8fafc] focus:outline-none focus:border-[#788e4b] focus:bg-white text-sm" placeholder="••••••••" required>
        </div>

        <div *ngIf="error" class="bg-[#fee2e2] text-[#ef4444] px-4 py-2.5 rounded-xl text-xs font-semibold border border-[#fca5a5]">
          {{ error }}
        </div>

        <button type="submit" [disabled]="isLoading" class="w-full bg-[#788e4b] hover:bg-[#677b3e] text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 mt-2">
          <span *ngIf="isLoading" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
          <span>{{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}</span>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-[#f1f5f9] text-center space-y-3">
        <p class="text-sm text-[#475569]">
          Pas encore de compte ?
          <a routerLink="/register" class="font-bold text-[#788e4b] hover:underline">Créer un compte</a>
        </p>
        <a routerLink="/platform" class="text-xs font-bold text-[#788e4b] hover:underline inline-flex items-center gap-1">
          <span class="material-icons text-sm">arrow_back</span>
          <span>Accéder au portail public de réservation</span>
        </a>
      </div>
    </div>
  </div>
</div>
